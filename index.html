```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GYM WEBSITE</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <!-- Header Section -->
    <header class="header">

        <!-- Logo and Website Name -->
        <div class="left">
            <img
                src="../static/images/bodybuilder-male-figure-icon-gym-logo-template-athletic-man-sign-white-silhouette-on-black-background-illustration-vector.webp"
                alt="Gym Logo"
                class="logo">

            <div>Fitness &amp; Wellness</div>
        </div>

        <!-- Navigation Menu -->
        <div class="mid">
            <ul class="navbar">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Blog</a></li>
            </ul>
        </div>

        <!-- Buttons -->
        <div class="right">
            <button class="btn" type="button">Contact Us</button>
            <button class="btn" type="button">Call Us</button>
        </div>

    </header>

    <!-- Registration Section -->
    <section class="container">

        <h1>Join Our Fitness Goals</h1>

        <form action="#" method="post">

            <div class="form-group">
                <input type="text" name="name"
                    placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <input type="email" name="email"
                    placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <input type="tel" name="phone"
                    placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <select name="gender" required>
                    <option value="">Select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <input type="number" name="age"
                    placeholder="Enter your age"
                    min="13" max="100" required>
            </div>

            <div class="form-group">
                <textarea name="address"
                    placeholder="Enter your address"
                    rows="3" required></textarea>
            </div>

            <button class="btn" type="submit">Submit</button>

        </form>

    </section>

</body>

</html>
```
